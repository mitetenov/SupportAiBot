spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  sql:
    init:
      mode: never

llm:
  provider: deepseek

openai:
  api-key: test-openai-api-key
  base-url: https://api.openai.com/v1
  model: gpt-5.4-mini
