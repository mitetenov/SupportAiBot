spring:
  application:
    name: vpn-support-bot
  datasource:
    url: jdbc:postgresql://${PGVECTOR_HOST:pgvector}:${PGVECTOR_PORT:5432}/${PGVECTOR_DB:vpnsupport}
    driver-class-name: org.postgresql.Driver
    username: ${PGVECTOR_USER:bot}
    password: ${PGVECTOR_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  codec:
    max-in-memory-size: 10MB

chat:
  history:
    max-messages: 20
    ttl-days: 7

conversation:
  # How long the AI stays quiet after an operator replies in the topic.
  operator-suppression-window: 30m
  last-query-ttl: 6h

llm:
  provider: ${LLM_PROVIDER:deepseek}

embedding:
  provider: ${EMBEDDING_PROVIDER:gemini}

telegram:
  buffer:
    # Wait this long for the user to finish typing, then answer all of it at once.
    window: 2500ms
    max-messages: 5
  bot-token: ${TELEGRAM_BOT_TOKEN}
  support-group-chat-id: ${TELEGRAM_SUPPORT_GROUP_CHAT_ID}
  support-admin-username: ${TELEGRAM_SUPPORT_ADMIN_USERNAME}
  support-admin-telegram-ids: ${TELEGRAM_SUPPORT_ADMIN_TELEGRAM_IDS:}

deepseek:
  api-key: ${DEEPSEEK_API_KEY}
  base-url: https://api.deepseek.com/v1
  model: ${DEEPSEEK_MODEL}

gemini:
  api-key: ${GEMINI_API_KEY}
  base-url: https://generativelanguage.googleapis.com/v1beta
  model: ${GEMINI_MODEL}

openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: https://api.openai.com/v1
  model: ${OPENAI_MODEL:gpt-5.4-mini}
  embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
  temperature: ${OPENAI_TEMPERATURE:}

remnawave:
  mcp:
    url: ${REMNAWAVE_MCP_URL:http://localhost:3100}
    base-url: ${REMNAWAVE_BASE_URL}
    api-token: ${REMNAWAVE_API_TOKEN}
    readonly: ${REMNAWAVE_READONLY:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
