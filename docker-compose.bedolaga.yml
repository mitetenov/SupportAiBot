# Оверлей для интеграции с Bedolaga: подключает бота к сети чужого стека.
# Сеть создаётся один раз: docker network create bedolaga-net
#
# Запуск с интеграцией:
#   docker compose -f docker-compose.yml -f docker-compose.bedolaga.yml up -d
#
# Без этого файла обычный `docker compose up -d` работает как раньше и про
# Bedolaga ничего не знает.
services:
  support-bot:
    networks:
      - bedolaga

networks:
  bedolaga:
    external: true
    name: bedolaga-net
