# Оверлей для интеграции с Bedolaga: открывает webhook-порт бота на хосте.
# По умолчанию порт доступен только локальному reverse proxy. Если Bedolaga
# ходит напрямую по приватной сети, задайте BEDOLAGA_WEBHOOK_BIND равным
# приватному IP сервера поддержки.
#
# Запуск с интеграцией:
#   docker compose -f docker-compose.yml -f docker-compose.bedolaga.yml up -d
#
# Не публикуйте порт в интернет без firewall/reverse proxy. Webhook защищён
# обязательным секретом, но HTTPS всё равно рекомендуется.
services:
  support-bot:
    ports:
      - "${BEDOLAGA_WEBHOOK_BIND:-127.0.0.1}:8080:8080"
