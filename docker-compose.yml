services:
  support-bot:
    image: mitetenov/supportbot:${BOT_TAG:-latest}
    container_name: vpn-support-bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      pgvector:
        condition: service_healthy
      mcp-remnawave:
        condition: service_started
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  mcp-remnawave:
    image: mitetenov/mcp-remnawave:${MCP_TAG:-latest}
    container_name: vpn-support-mcp
    restart: unless-stopped
    environment:
      REMNAWAVE_BASE_URL: ${REMNAWAVE_BASE_URL}
      REMNAWAVE_API_TOKEN: ${REMNAWAVE_API_TOKEN}
      REMNAWAVE_API_KEY: ${REMNAWAVE_API_KEY:-}
      REMNAWAVE_READONLY: ${REMNAWAVE_READONLY:-true}
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3100/health', r => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  pgvector:
    image: pgvector/pgvector:pg17
    container_name: vpn-support-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGVECTOR_USER:-bot}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD}
      POSTGRES_DB: ${PGVECTOR_DB:-vpnsupport}
    networks:
      - internal
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGVECTOR_USER:-bot} -d ${PGVECTOR_DB:-vpnsupport}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  internal:
    driver: bridge

volumes:
  pgvector-data:
