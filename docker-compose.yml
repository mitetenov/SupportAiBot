services:
  support-bot:
    image: mitetenov/supportbot:${BOT_TAG:-latest}
    container_name: vpn-support-bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      pgvector:
        condition: service_healthy
      mcp-remnawave:
        condition: service_healthy
      # bedolaga-mcp всегда в стеке и должен быть здоров до старта бота:
      # флаг BEDOLAGA_MCP_ENABLED (runtime, в .env) управляет только тем,
      # использует ли бот этот MCP. После старта падение одного MCP не
      # останавливает другого (см. README, «Два MCP»).
      bedolaga-mcp:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  mcp-remnawave:
    image: mitetenov/remnawave-mcp:${MCP_TAG:-v3.3.0}
    container_name: vpn-support-mcp
    restart: unless-stopped
    env_file: .env
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3100/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Личный MCP Bedolaga: персональные инструменты для Telegram support.
  # Держим только на внутренней сети — порт на host НЕ публикуем, бот ходит
  # по http://bedolaga-mcp:3100. Тег закреплён: образ публикует :{sha} и
  # :{version}, без :latest. Если MCP не нужен, уберите сервис и его запись
  # в depends_on support-bot (BEDOLAGA_MCP_ENABLED=false бот и так не использует).
  bedolaga-mcp:
    image: mitetenov/bedolaga-mcp:${BEDOLAGA_MCP_TAG:-1.2.0}
    container_name: bedolaga-mcp
    restart: on-failure:5
    env_file: .env
    environment:
      # The latest image validates these names when a tool creates its API client.
      # Keep them explicit instead of relying on the legacy HOST/PORT fallback.
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 3100
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3100/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  pgvector:
    image: pgvector/pgvector:pg17
    container_name: vpn-support-pg
    restart: unless-stopped
    env_file: .env
    networks:
      - internal
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  internal:
    driver: bridge

volumes:
  pgvector-data:
