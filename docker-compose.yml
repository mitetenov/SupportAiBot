services:
  support-bot:
    image: mitetenov/supportbot:${BOT_TAG:-latest}
    container_name: vpn-support-bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      pgvector:
        condition: service_healthy
      mcp-remnawave:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  mcp-remnawave:
    image: mitetenov/remnawave-mcp:${MCP_TAG:-v3.2.1}
    container_name: vpn-support-mcp
    restart: unless-stopped
    env_file: .env
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3100/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  pgvector:
    image: pgvector/pgvector:pg17
    container_name: vpn-support-pg
    restart: unless-stopped
    env_file: .env
    networks:
      - internal
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  internal:
    driver: bridge

volumes:
  pgvector-data:
