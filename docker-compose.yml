services:
  support-bot:
    image: mitetenov/supportbot:${BOT_TAG:-latest}
    container_name: vpn-support-bot
    restart: unless-stopped
    env_file: .env
    environment:
      REMNAWAVE_MCP_URL: ${REMNAWAVE_MCP_URL:-http://mcp-remnawave:3100}
    depends_on:
      pgvector:
        condition: service_healthy
      mcp-remnawave:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  mcp-remnawave:
    # Pinned, not :latest — the MCP gates its tool surface on the panel version
    # and on REMNAWAVE_IS_SUPPORT, so a silent image bump can silently take
    # tools away from the bot. Requires panel Remnawave 3.3.x.
    image: mitetenov/remnawave-mcp:${MCP_TAG:-v3.2.0}
    container_name: vpn-support-mcp
    restart: unless-stopped
    environment:
      REMNAWAVE_BASE_URL: ${REMNAWAVE_BASE_URL}
      REMNAWAVE_API_TOKEN: ${REMNAWAVE_API_TOKEN}
      REMNAWAVE_API_KEY: ${REMNAWAVE_API_KEY:-}
      # Support mode: 16 user-facing tools, VPN credentials stripped from every
      # response. Parsed fail-closed — only the exact string "false" unlocks the
      # full 179-tool surface, which this bot does not need.
      REMNAWAVE_IS_SUPPORT: ${REMNAWAVE_IS_SUPPORT:-true}
      REMNAWAVE_TIMEOUT_MS: ${REMNAWAVE_TIMEOUT_MS:-30000}
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3100/health', r => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  pgvector:
    image: pgvector/pgvector:pg17
    container_name: vpn-support-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGVECTOR_USER:-bot}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD}
      POSTGRES_DB: ${PGVECTOR_DB:-vpnsupport}
    networks:
      - internal
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGVECTOR_USER:-bot} -d ${PGVECTOR_DB:-vpnsupport}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  internal:
    driver: bridge

volumes:
  pgvector-data:
