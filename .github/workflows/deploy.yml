name: Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy'
        required: true
        default: 'latest'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Deploying supportbot:${{ inputs.tag }}..."
            cd /root/supportBot
            export BOT_TAG=${{ inputs.tag }}
            docker compose pull
            # --force-recreate covers mcp-remnawave too: it keeps a single
            # global session with no teardown, so a bot restarted beside a
            # still-running MCP gets "already initialized" and comes up with no
            # Remnawave tools. --wait fails the deploy if anything stays unhealthy.
            docker compose up -d --force-recreate --wait
            echo "✅ supportbot:${{ inputs.tag }} deployed"
