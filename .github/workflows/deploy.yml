name: Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy'
        required: true
        default: 'latest'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-26.04
    env:
      BOT_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate Docker tag
        run: |
          [[ "$BOT_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          envs: BOT_TAG
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Deploying supportbot:$BOT_TAG..."
            cd /root/supportBot
            [[ "$BOT_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]
            export BOT_TAG
            docker compose pull support-bot
            docker compose up -d --wait support-bot
            echo "✅ supportbot:$BOT_TAG deployed"
