name: Go CI & Docker

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# New commits replace obsolete PR runs; publication runs keep their own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: '1.27.3'
  GOTOOLCHAIN: local

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: parity
          POSTGRES_PASSWORD: local-parity-only
          POSTGRES_DB: supportbot_parity
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U parity -d supportbot_parity"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        id: go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Restore Go modules and compilation cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go.outputs.go-version }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ hashFiles('cmd/**', 'internal/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go.outputs.go-version }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}-
            ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go.outputs.go-version }}-${{ github.job }}-
            ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go.outputs.go-version }}-
      - name: Verify module manifests
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify
      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet Go
        run: go vet ./...
      - name: Test Go with race detector
        env:
          TEST_DATABASE_URL: postgres://parity:local-parity-only@localhost:5432/supportbot_parity?sslmode=disable
        # Vet already ran for every package. Always execute the DB/race tests.
        run: go run ./cmd/check -vet=off

  image-check:
    name: image-check (amd64)
    # Independent of the race suite: both remain required before merging.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        id: go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Restore Go modules and compilation cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go.outputs.go-version }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ hashFiles('cmd/**', 'internal/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go.outputs.go-version }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}-
            ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go.outputs.go-version }}-${{ github.job }}-
            ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go.outputs.go-version }}-
      - name: Build native container verifier once
        run: go build -trimpath -o "$RUNNER_TEMP/supportbot-verify" ./cmd/verify
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0
      - name: Validate Linux AMD64 image without publication
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: supportbot:ci
          platforms: linux/amd64
          cache-from: type=gha,scope=supportbot-go
          cache-to: type=gha,scope=supportbot-go,mode=max
      - name: Verify read-only container, fixtures, persistence and shutdown
        run: '"$RUNNER_TEMP/supportbot-verify" smoke --image supportbot:ci'
      - name: Verify static runtime, certificates, DNS and TLS
        run: '"$RUNNER_TEMP/supportbot-verify" runtime --image supportbot:ci'

  build:
    name: build
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Keep registry version allocation and push in the same serialized job.
    concurrency:
      group: supportbot-dockerhub-publication
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        id: go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Restore Go modules and compilation cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go.outputs.go-version }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ hashFiles('cmd/**', 'internal/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go.outputs.go-version }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}-
            ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go.outputs.go-version }}-${{ github.job }}-
            ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go.outputs.go-version }}-
      - name: Pick the version to publish
        id: version
        run: go run ./cmd/nextversion mitetenov/supportbot >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0
      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Refuse to overwrite a published version
        run: |
          TAG="mitetenov/supportbot:${{ steps.version.outputs.version }}"
          if docker manifest inspect "$TAG" > /dev/null 2>&1; then
            echo "::error::$TAG is already published, but the version picker chose it."
            exit 1
          fi
          echo "$TAG is free"
      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            mitetenov/supportbot:latest
            mitetenov/supportbot:${{ steps.version.outputs.version }}
            mitetenov/supportbot:${{ github.sha }}
          cache-from: type=gha,scope=supportbot-go
          cache-to: type=gha,scope=supportbot-go,mode=max
