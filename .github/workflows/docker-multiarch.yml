name: Docker Multi-Arch Build & Push

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # The merge gate. Runs on every pull request; `build` below does not, so this
  # is the job branch protection should require.
  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: parity
          POSTGRES_PASSWORD: local-parity-only
          POSTGRES_DB: supportbot_parity
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U parity -d supportbot_parity"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd internal)"

      - name: Vet Go
        run: go vet ./...

      - name: Test Go with race detector
        env:
          TEST_DATABASE_URL: postgres://parity:local-parity-only@localhost:5432/supportbot_parity?sslmode=disable
        run: ./scripts/parity/test_go.sh

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # Fails if pyproject.toml and uv.lock have drifted apart, so the image is
      # never built from dependencies CI did not test.
      - name: Verify lock file is current
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --extra dev --no-install-project

      - name: Run linter
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      # The codebase is annotated throughout; without this the annotations are
      # documentation that nothing checks.
      - name: Check types
        run: uv run --no-sync mypy

      # Coverage settings (including the floor that fails the job) live in
      # pyproject.toml, so a local run gates on exactly what CI gates on.
      - name: Run tests
        run: uv run --no-sync pytest -v

  image-check:
    name: image-check (amd64 + arm64)
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0
      - name: Validate native multi-platform images without publication
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=supportbot-go
          cache-to: type=gha,scope=supportbot-go,mode=max

  build:
    name: build
    needs: test
    # Nothing to publish from a pull request; the image is built and pushed
    # only once the change is on master.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # The major line is declared by hand in pyproject.toml; the minor is taken
      # from what is already on Docker Hub. So an ordinary merge to master never
      # touches the version and never lands on a tag that exists, and two merges
      # arriving together cannot pick the same number — unlike a scheme that
      # commits the bump back to master.
      - name: Pick the version to publish
        id: version
        run: python3 .github/scripts/next_version.py mitetenov/supportbot >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # :latest and the commit sha are always safe to move. The version tag is
      # not: replacing the image a version tag points at leaves nothing to roll
      # back to. The step above is what keeps that from happening; this one is
      # the second pair of eyes, and it asks the registry the way the push will.
      # Runs after the login so a repository that is not public fails the check
      # loudly instead of reading "cannot see it" as "free".
      - name: Refuse to overwrite a published version
        run: |
          TAG="mitetenov/supportbot:${{ steps.version.outputs.version }}"
          if docker manifest inspect "$TAG" > /dev/null 2>&1; then
            echo "::error::$TAG is already published, but the version picker chose it."
            echo "::error::That means the tag listing was incomplete — do not retry blindly."
            exit 1
          fi
          echo "$TAG is free"

      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            mitetenov/supportbot:latest
            mitetenov/supportbot:${{ steps.version.outputs.version }}
            mitetenov/supportbot:${{ github.sha }}
          cache-from: type=gha,scope=supportbot-go
          cache-to: type=gha,scope=supportbot-go,mode=max
