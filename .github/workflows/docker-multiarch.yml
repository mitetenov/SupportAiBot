name: Docker Multi-Arch Build & Push

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # The merge gate. Runs on every pull request; `build` below does not, so this
  # is the job branch protection should require.
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn -B test -pl bot

  build:
    name: build
    needs: test
    # Nothing to publish from a pull request; the image is built and pushed
    # only once the change is on master.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Reading the pom directly rather than starting Maven for one string:
      # `mvn help:evaluate` took ~3s and needed a JDK in this job, which is
      # otherwise not required here at all.
      - name: Extract version from POM
        id: version
        run: |
          VERSION=$(python3 -c "import xml.etree.ElementTree as ET; \
            print(ET.parse('pom.xml').getroot().find( \
              '{http://maven.apache.org/POM/4.0.0}version').text)")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version ${VERSION}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            mitetenov/supportbot:latest
            mitetenov/supportbot:${{ steps.version.outputs.version }}
            mitetenov/supportbot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
