name: Docker Build & Push

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR checks are disposable. Master validation keeps independent runs;
# publication has its own lock so a docs-only push cannot replace a queued build.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      go: ${{ steps.changes.outputs.go }}
      python: ${{ steps.changes.outputs.python }}
      image: ${{ steps.changes.outputs.image }}
    steps:
      - name: Checkout tested revision and diff history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select required checks
        id: changes
        run: python3 .github/scripts/ci_changes.py

  go-test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: parity
          POSTGRES_PASSWORD: local-parity-only
          POSTGRES_DB: supportbot_parity
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U parity -d supportbot_parity"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go (same compiler as Dockerfile)
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: true
      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet Go
        run: go vet ./...
      - name: Test Go with race detector and real PostgreSQL
        env:
          TEST_DATABASE_URL: postgres://parity:local-parity-only@localhost:5432/supportbot_parity?sslmode=disable
        run: ./scripts/parity/test_go.sh

  python-test:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uv installs the requested Python itself; a second installer is redundant.
      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.14'
          enable-cache: true
      - name: Verify lock file is current
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --frozen --extra dev --no-install-project
      - name: Run linter
        run: uv run --no-sync ruff check .
      - name: Check formatting
        run: uv run --no-sync ruff format --check .
      - name: Restore incremental mypy cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .mypy_cache
          key: ${{ runner.os }}-mypy-3.14-${{ hashFiles('uv.lock', 'pyproject.toml') }}-${{ hashFiles('app/**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-mypy-3.14-${{ hashFiles('uv.lock', 'pyproject.toml') }}-
      - name: Check types
        run: uv run --no-sync mypy
      - name: Run tests with the existing coverage floor
        run: uv run --no-sync pytest -q

  image-check:
    name: image-check (amd64)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Validate Linux AMD64 image without publication
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=supportbot-go
          cache-to: type=gha,scope=supportbot-go,mode=max

  # Keep the existing required-check name. A failed/cancelled prerequisite or an
  # unexpectedly skipped required job must fail this gate, even with path filters.
  test:
    name: test
    needs: [changes, go-test, python-test, image-check]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every selected check to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          GO_REQUIRED: ${{ needs.changes.outputs.go }}
          GO_RESULT: ${{ needs.go-test.result }}
          PYTHON_REQUIRED: ${{ needs.changes.outputs.python }}
          PYTHON_RESULT: ${{ needs.python-test.result }}
          IMAGE_REQUIRED: ${{ github.event_name == 'pull_request' && needs.changes.outputs.image == 'true' }}
          IMAGE_RESULT: ${{ needs.image-check.result }}
        run: |
          test "$CHANGES_RESULT" = success
          require_check() {
            case "$1" in
              true) test "$2" = success ;;
              false) test "$2" = skipped ;;
              *) return 1 ;;
            esac
          }
          require_check "$GO_REQUIRED" "$GO_RESULT"
          require_check "$PYTHON_REQUIRED" "$PYTHON_RESULT"
          require_check "$IMAGE_REQUIRED" "$IMAGE_RESULT"

  build:
    name: build
    needs: [changes, test]
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/master' &&
      needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Lock version selection AND publication. Registry tag listing alone is not
    # an atomic reservation; never cancel a running push halfway through.
    concurrency:
      group: supportbot-dockerhub-publish
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Ubuntu 24.04 already provides Python >=3.11 and tomllib for this stdlib script.
      - name: Pick the version to publish
        id: version
        run: python3 .github/scripts/next_version.py mitetenov/supportbot >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Refuse to overwrite a published version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="mitetenov/supportbot:$VERSION"
          if docker manifest inspect "$TAG" > /dev/null 2>&1; then
            echo "::error::$TAG is already published, but the version picker chose it."
            echo "::error::That means the tag listing was incomplete — do not retry blindly."
            exit 1
          fi
          echo "$TAG is free"
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            mitetenov/supportbot:latest
            mitetenov/supportbot:${{ steps.version.outputs.version }}
            mitetenov/supportbot:${{ github.sha }}
          cache-from: type=gha,scope=supportbot-go
          cache-to: type=gha,scope=supportbot-go,mode=max
