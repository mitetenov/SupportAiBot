name: Docker Multi-Arch Build & Push

on:
  push:
    branches: [master]
  workflow_dispatch:  # можно запустить вручную из Actions
  repository_dispatch:
    types: [mcp-release]  # триггер от CI mcp-remnawave при новом релизе

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          # MCP: fetch pre-built mcp-release.zip from mitetenov/mcp-remnawave
          build-args: |
            MCP_OWNER=mitetenov
            MCP_REPO=mcp-remnawave
          tags: |
            mitetenov/supportbot:latest
            mitetenov/supportbot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
