name: Docker Multi-Arch Build & Push

on:
  push:
    branches: [master]
  workflow_dispatch:  # можно запустить вручную из Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Cache Node.js dependencies for faster MCP source install inside
      # the Docker build.  This complements the BuildKit mount cache.
      - name: Cache npm dependencies (host-level fallback)
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache/npm
          key: npm-${{ runner.os }}-${{ hashFiles('.github/workflows/docker-multiarch.yml') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          # MCP source: upstream TrackLine/mcp-remnawave latest release
          build-args: |
            MCP_OWNER=TrackLine
            MCP_REPO=mcp-remnawave
            MCP_VERSION=latest
          tags: |
            mitetenov/supportbot:latest
            mitetenov/supportbot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
